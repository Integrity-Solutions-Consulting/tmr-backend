<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{TITULO_CORREO}}</title>
</head>
<body style="margin: 0; padding: 32px 12px; background-color: #f1f5f9; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color: #1e293b; -webkit-font-smoothing: antialiased;">
  <table role="presentation" cellpadding="0" cellspacing="0" width="100%" style="max-width: 520px; margin: 0 auto; background-color: #ffffff; border: 1px solid #e2e8f0; border-top: 4px solid #163572; border-radius: 8px; box-shadow: 0 4px 12px rgba(15, 23, 42, 0.04); overflow: hidden;">
    
    <!-- ENCABEZADO: LOGO + BADGE FOLIO -->
    <tr>
      <td style="padding: 24px 28px 16px 28px;">
        <table role="presentation" cellpadding="0" cellspacing="0" width="100%">
          <tr>
            <td align="left" style="vertical-align: middle;">
              <img src="{{LOGO_URL}}" alt="Integrity Solutions" style="height: 32px; max-height: 32px; width: auto; display: block; border: 0;" />
            </td>
            <td align="right" style="vertical-align: middle;">
              <span style="display: inline-block; background-color: #f8fafc; color: #334155; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 4px; border: 1px solid #cbd5e1; letter-spacing: 0.5px;">
                {{FOLIO}}
              </span>
            </td>
          </tr>
        </table>
        <div style="border-top: 1px solid #f1f5f9; margin-top: 16px;"></div>
      </td>
    </tr>

    <!-- CUERPO PRINCIPAL -->
    <tr>
      <td style="padding: 0 28px 20px 28px;">
        <p style="margin: 0 0 10px 0; font-size: 15px; font-weight: 600; color: #0f172a;">
          Hola {{NOMBRE_DESTINATARIO}},
        </p>
        <p style="margin: 0 0 18px 0; font-size: 14px; line-height: 1.55; color: #475569;">
          {{MENSAJE_PERSONALIZADO}}
        </p>

        <!-- TARJETA DE RESUMEN ELEGANTE -->
        <table role="presentation" cellpadding="0" cellspacing="0" width="100%" style="background-color: #f8fafc; border: 1px solid #e2e8f0; border-radius: 6px; margin: 0 0 16px 0; border-collapse: separate;">
          <tr>
            <td style="padding: 10px 14px; border-bottom: 1px solid #edf2f7; width: 34%; font-size: 12px; color: #64748b; font-weight: 500;">
              Tipo de Permiso
            </td>
            <td style="padding: 10px 14px; border-bottom: 1px solid #edf2f7; font-size: 13px; color: #0f172a; font-weight: 600;">
              {{TIPO_PERMISO}}
            </td>
          </tr>
          <tr>
            <td style="padding: 10px 14px; border-bottom: 1px solid #edf2f7; width: 34%; font-size: 12px; color: #64748b; font-weight: 500;">
              Colaborador
            </td>
            <td style="padding: 10px 14px; border-bottom: 1px solid #edf2f7; font-size: 13px; color: #0f172a; font-weight: 600;">
              {{COLABORADOR}}
            </td>
          </tr>
          <tr>
            <td style="padding: 10px 14px; border-bottom: 1px solid #edf2f7; width: 34%; font-size: 12px; color: #64748b; font-weight: 500;">
              Período Solicitado
            </td>
            <td style="padding: 10px 14px; border-bottom: 1px solid #edf2f7; font-size: 13px; color: #0f172a; font-weight: 600;">
              {{FECHAS}}
            </td>
          </tr>
          <tr>
            <td style="padding: 10px 14px; width: 34%; font-size: 12px; color: #64748b; font-weight: 500;">
              Duración
            </td>
            <td style="padding: 10px 14px; font-size: 13px; color: #0f172a; font-weight: 600;">
              {{DURACION}}
            </td>
          </tr>
        </table>

        <!-- COMENTARIOS U OBSERVACIONES (SI APLICA) -->
        {{FILA_COMENTARIOS}}
      </td>
    </tr>

    <!-- BOTÓN DE ACCIÓN DIRECTO -->
    <tr>
      <td style="padding: 0 28px 24px 28px; text-align: left;">
        <table role="presentation" cellpadding="0" cellspacing="0" style="margin: 0;">
          <tr>
            <td align="center" style="background-color: #163572; border-radius: 6px;">
              <a href="{{CTA_URL}}" target="_blank" style="display: inline-block; padding: 11px 24px; color: #ffffff; text-decoration: none; font-size: 13px; font-weight: 600; border-radius: 6px; letter-spacing: 0.2px;">
                {{CTA_TEXTO}} &rarr;
              </a>
            </td>
          </tr>
        </table>
      </td>
    </tr>

    <!-- PIE INSTITUCIONAL -->
    <tr>
      <td style="background-color: #f8fafc; border-top: 1px solid #e2e8f0; padding: 14px 28px; font-size: 11px; color: #94a3b8; line-height: 1.45;">
        <table role="presentation" cellpadding="0" cellspacing="0" width="100%">
          <tr>
            <td align="left" style="color: #64748b;">
              <strong>ISC Time Report</strong> · Gestión de Solicitudes y Ausencias
            </td>
            <td align="right" style="color: #94a3b8;">
              {{ANIO_ACTUAL}}
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>

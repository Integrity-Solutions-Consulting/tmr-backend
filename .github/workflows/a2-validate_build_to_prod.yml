name: Validate Build

on:
  pull_request:
    branches:
      - master

jobs:
  build-check:
    if: "!startsWith(github.head_ref, 'release-please--')"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tmr_ci
          POSTGRES_USER: tmr_ci
          # Credencial exclusiva del servicio efímero de este job.
          POSTGRES_PASSWORD: tmr-ci-ephemeral-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tmr_ci -d tmr_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Nunca obtiene conexiones de Dokploy ni de secrets de bases reales.
      ConnectionStrings__DefaultConnection: Host=127.0.0.1;Port=5432;Database=tmr_ci;Username=tmr_ci;Password=tmr-ci-ephemeral-only

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build de la imagen (carga local, sin push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./.docker/containerfile
          push: false
          load: true
          tags: build-validation:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validar secretos exclusivos de CI
        env:
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
        run: |
          if [ -z "$JWT_SECRET_KEY" ]; then
            echo "Falta el secret JWT_SECRET_KEY en GitHub."
            exit 1
          fi
          if [ "${#JWT_SECRET_KEY}" -lt 32 ]; then
            echo "JWT_SECRET_KEY debe tener al menos 32 caracteres."
            exit 1
          fi
      - name: Preparar e inicializar PostgreSQL vacío y comprobar repetición
        env:
          Bootstrap__AdminEmail: admin@ci.invalid
          Bootstrap__AdminIdentification: CI-ADMIN
          Bootstrap__AdminName: CI Administrator
        run: |
          export Bootstrap__AdminPassword="$(openssl rand -hex 24)"
          for attempt in 1 2; do
            docker run --rm --network host \
              -e ConnectionStrings__DefaultConnection \
              build-validation:pr-${{ github.event.pull_request.number }} --prepare-database
            docker run --rm --network host \
              -e ConnectionStrings__DefaultConnection \
              -e Bootstrap__AdminEmail -e Bootstrap__AdminIdentification \
              -e Bootstrap__AdminName -e Bootstrap__AdminPassword \
              build-validation:pr-${{ github.event.pull_request.number }} --initialize-data
          done
          docker run --rm --network host \
            -e ConnectionStrings__DefaultConnection \
            build-validation:pr-${{ github.event.pull_request.number }} --verify-database

      - name: Levantar contenedor de prueba
        env:
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
        run: |
          docker run -d --name build-validation-container --network host \
            -e "Jwt__SecretKey=${JWT_SECRET_KEY}" \
            -e ConnectionStrings__DefaultConnection \
            build-validation:pr-${{ github.event.pull_request.number }}

      - name: Esperar a que el contenedor responda
        run: |
          echo "Esperando a que el contenedor esté listo..."
          for i in $(seq 1 30); do
            if [ "$(docker inspect -f '{{.State.Running}}' build-validation-container)" != true ]; then
              docker logs build-validation-container
              exit 1
            fi
            if curl --fail -s -o /dev/null http://localhost:8080/health/live; then
              echo "Contenedor respondiendo en /health/live."
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "El contenedor no respondió a tiempo."
              docker logs build-validation-container
              exit 1
            fi
            sleep 2
          done

      - name: Smoke test - liveness endpoint
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/health/live)
          echo "HTTP status recibido: $status"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "El liveness check no respondió correctamente. Status: $status"
            docker logs build-validation-container
            exit 1
          fi
          echo "Liveness check OK ($status)"

      - name: Smoke test - readiness PostgreSQL
        run: curl --fail --silent --show-error http://localhost:8080/health/ready

      - name: Limpiar contenedor
        if: always()
        run: |
          docker stop build-validation-container || true
          docker rm build-validation-container || true
